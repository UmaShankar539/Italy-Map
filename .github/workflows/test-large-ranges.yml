      - name: Test PMTiles browser headers
        run: |
          URL="https://drive.usercontent.google.com/download?id=1jfG78ZV41RajX3qoNsG0-HP636c0s5P0&export=download&confirm=t"

          curl -L -sS -D headers.txt \
            -H "Origin: https://umashankar539.github.io" \
            -H "Range: bytes=0-126" \
            -o header.bin "$URL"

          echo "RESPONSE HEADERS:"
          cat headers.txt

          echo "DOWNLOADED SIZE:"
          wc -c < header.bin
