
name: Test Google Drive PMTiles Streaming

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Google Drive Range Requests
        run: |
          URL="https://drive.google.com/uc?export=download&id=1jfG78ZV41RajX3qoNsG0-HP636c0s5P0"

          curl -L --range 0-1023 \
            -D headers.txt \
            -o /dev/null \
            "$URL"

          echo "===== RESPONSE HEADERS ====="
          grep -iE '^HTTP/|^content-range:|^content-length:|^content-type:' headers.txt
