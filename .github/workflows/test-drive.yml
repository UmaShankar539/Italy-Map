
name: Test Google Drive PMTiles Streaming

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Google Drive Range Requests
        run: |
          URL="https://drive.google.com/uc?export=download&id=1jfG78ZV41RajX3qoNsG0-HP636c0s5P0"

          echo "Testing Google Drive partial download..."

          curl -sS -L \
            --range 0-1023 \
            -D - \
            -o /dev/null \
            -w "\nFINAL HTTP STATUS: %{http_code}\nDOWNLOADED: %{size_download} bytes\nFINAL URL: %{url_effective}\n" \
            "$URL"
