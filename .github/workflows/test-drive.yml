
name: Test Google Drive PMTiles Streaming

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Google Drive partial download
        run: |
          URL="https://drive.usercontent.google.com/download?id=1jfG78ZV41RajX3qoNsG0-HP636c0s5P0&export=download&confirm=t"

          curl -sS -L \
            --range 0-1023 \
            -D headers.txt \
            -o part.bin \
            "$URL"

          echo "===== RESPONSE HEADERS ====="
          cat headers.txt

          echo "===== FILE SIZE ====="
          wc -c part.bin
